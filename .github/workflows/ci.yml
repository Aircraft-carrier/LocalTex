name: CI

on:
  push:
    branches: [mac]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: windows-latest
            node: 20
          - os: macos-latest
            node: 20
          - os: ubuntu-latest
            node: 22

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run syntax checks
        run: npm run check

      - name: Run test suite
        run: npm test

      - name: Audit production dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.node == 20
        run: npm audit --omit=dev --audit-level=high
